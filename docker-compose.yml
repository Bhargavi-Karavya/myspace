services:
  postgres:
    image: postgres:17-alpine
    container_name: myspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myspace}
      POSTGRES_USER: ${POSTGRES_USER:-myspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myspace_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
