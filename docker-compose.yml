services:
  postgres:
    # Official pgvector image (PostgreSQL 17). plain postgres:17-alpine has no vector extension.
    image: pgvector/pgvector:pg17
    container_name: myspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myspace}
      POSTGRES_USER: ${POSTGRES_USER:-myspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myspace_password}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
